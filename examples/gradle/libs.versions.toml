[versions]
# @keep
android-compileSdk = "37"
# @pin
android-gradle-plugin = "9.1.1"
# @keep
android-minSdk = "26"
# @keep
android-targetSdk = "37"
androidx-activity-compose = "1.13.0"
androidx-appcompat-appcompat = "1.8.0"
androidx-core-ktx = "1.19.0"
compose = "1.12.1"
compose-extensions = "1.12.1.2"
compose-material-icons = "1.7.3"
compose-material3 = "1.12.0-alpha03"
# @pin
kotlin = "2.4.20"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
androidx-appcompat-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat-appcompat" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core-ktx" }
compose-animation-graphics = { module = "org.jetbrains.compose.animation:animation-graphics", version.ref = "compose" }
compose-extensions-calendar = { module = "in.procyk.compose:calendar", version.ref = "compose-extensions" }
compose-extensions-camera-permission = { module = "in.procyk.compose:camera-permission", version.ref = "compose-extensions" }
compose-extensions-camera-qr = { module = "in.procyk.compose:camera-qr", version.ref = "compose-extensions" }
compose-extensions-util = { module = "in.procyk.compose:util", version.ref = "compose-extensions" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose" }
compose-material-icons-extended = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "compose-material-icons" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose" }

[plugins]
android-application = { id = "com.android.application", version.ref = "android-gradle-plugin" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "android-gradle-plugin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
